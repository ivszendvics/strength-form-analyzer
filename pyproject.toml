[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strength-form-analyzer"
version = "0.1.0"
description = "Computer-vision strength-training form analyzer using pose estimation and rule-based biomechanical analysis."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Strength Form Analyzer Contributors" }]
keywords = ["computer-vision", "pose-estimation", "biomechanics", "fitness", "mediapipe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    # Pinned below 1.0: mediapipe 1.0.1's PoseLandmarker graph crashes on some
    # macOS setups ("Check failed: service_ Service is unavailable" in
    # TensorsToDetectionsCalculator) even with the CPU delegate forced.
    # 0.10.x is the last line verified stable for this project.
    "mediapipe>=0.10.18,<0.11",
    "opencv-python>=4.9.0",
    "numpy>=1.26,<2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
strength-form-analyzer = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
