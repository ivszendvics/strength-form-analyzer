# Lunge thresholds and weights.
#
# Front/rear leg identification uses a positional heuristic documented in
# src/exercises/lunge.py -- it can misclassify legs for a narrow-stance or
# in-place lunge. These thresholds are starting-point heuristics, not
# values calibrated against labeled data -- see README "Data and
# Calibration" before relying on this beyond a portfolio/demo project.

rep_detection:
  # Angles at the front knee. Larger = straighter leg.
  standing_angle: 165
  descending_threshold: 155
  bottom_angle: 100
  ascending_threshold: 115
  standing_return_threshold: 155
  min_rep_duration_seconds: 0.5
  min_frames_in_state: 2

form:
  depth:
    # Front knee angle target -- ~90 degrees is a common "front thigh
    # roughly parallel to the floor" heuristic.
    target_angle: 95
    tolerance: 10

  rear_depth:
    # Rear knee angle target -- how close the rear knee gets toward the floor.
    target_angle: 100
    tolerance: 12

  trunk:
    max_angle: 35

  tempo:
    max_deviation_ratio: 0.4

  consistency:
    min_rom_ratio_vs_earlier: 0.8

scoring:
  depth: 0.35
  rear_depth: 0.20
  trunk: 0.20
  tempo: 0.10
  stability: 0.15
  good_threshold: 80
